providers:
  openrouter:
    preset: openrouter
    baseUrl: ${MAIC_AI_ENDPOINT}
    apiKey: ${MAIC_AI_TICKET}
    models: [anthropic/claude-haiku-5.5]
  narration:
    preset: openai-tts
    baseUrl: ${MAIC_AI_ENDPOINT}
    apiKey: ${MAIC_AI_TICKET}
    models: [google/gemini-3.8-flash-lite-tts]
    options:
      defaultVoice: Kore
    voices:
      - { id: Kore, name: Kore }
      - { id: Puck, name: Puck }
  transcription:
    preset: openai-whisper
    baseUrl: ${MAIC_AI_ENDPOINT}
    apiKey: ${MAIC_AI_TICKET}
    models: [openai/gpt-4o-transcribe]
  illustration:
    preset: openrouter-image
    baseUrl: ${MAIC_AI_ENDPOINT}
    apiKey: ${MAIC_AI_TICKET}
    models: [google/gemini-3.1-flash-lite-image]
slots:
  llm:
    model: openrouter:anthropic/claude-haiku-5.5
  agent:
    model: openrouter:anthropic/claude-haiku-5.5
    api: openai-completions
  tts: narration:google/gemini-3.8-flash-lite-tts
  asr: transcription:openai/gpt-4o-transcribe
  image: illustration:google/gemini-3.1-flash-lite-image
lock: all
allowUserKeys: false
